[package]
name = "timbre-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Timbre — the connector for Apple Mail and Claude: instant full-text search, safe reading and filing over MCP."
authors = ["Alejandro San Martin Lamas (https://github.com/alejandrosml)"]
license = "MIT"
repository = "https://github.com/alejandrosml/timbre"
homepage = "https://github.com/alejandrosml/timbre"
readme = "README.md"
keywords = ["mcp", "apple-mail", "email", "search", "claude"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "timbre"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "time", "sync"] }
rusqlite = { version = "0.41", features = ["bundled"] }
mail-parser = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
scraper = "0.29"
encoding_rs = "0.8"
ego-tree = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
