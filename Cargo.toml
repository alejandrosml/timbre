[package]
name = "timbre-mail"
version = "0.6.1"
edition = "2024"
rust-version = "1.98"
description = "Timbre — the connector for Apple Mail and Claude: instant full-text search, safe reading and filing over MCP."
authors = ["Alejandro San Martin Lamas (https://github.com/alejandrosml)"]
license = "MIT"
repository = "https://github.com/alejandrosml/timbre"
homepage = "https://github.com/alejandrosml/timbre"
readme = "README.md"
keywords = ["mcp", "apple-mail", "email", "search", "claude"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "timbre"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "time", "sync"] }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
zstd = { version = "0.14", default-features = false }
mail-parser = { version = "1", features = ["full_encoding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
scraper = "0.29"
# The CSS tokenizer and selector engine scraper is built on (Firefox's), used
# directly to read style sheets and match rules as a browser does.
cssparser = "0.38"
selectors = "0.41"
html5ever = "0.40"
encoding_rs = "0.8"
ego-tree = "0.11"
unicode-normalization = "0.1"
# TLS for talking to the mail server itself (IMAP), certificates checked by
# the system's own trust settings.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1"
libc = "0.2"
# The keychain, where the password for the mail server is kept.
security-framework = "3"

[lints.rust]
unsafe_code = "deny" # the few libc calls are allowed where they are made

[lints.clippy]
# stdout carries the MCP protocol: only CLI subcommands may print to it.
print_stdout = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"    # one malformed message must not take the server down
strip = "debuginfo" # keep function names in backtraces
