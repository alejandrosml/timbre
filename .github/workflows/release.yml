# Builds, signs (Developer ID, hardened runtime), notarizes and publishes a
# release when a tag like v0.4.0 is pushed. Run it by hand (Actions → Release
# → Run workflow) for a dry run: same build and package, ad-hoc signature, no
# notarization, nothing published.
#
# Repository secrets (scripts/setup-release-signing.sh sets them from a Mac):
#   MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_API_KEY               base64 of an App Store Connect team API key (.p8)
#   APPLE_API_KEY_ID, APPLE_API_ISSUER
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check secrets
        if: env.DRY_RUN != 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$CERT" ] || [ -z "$KEY" ]; then
            echo "::error::Signing secrets are missing: run scripts/setup-release-signing.sh on a Mac."
            exit 1
          fi
      - name: Toolchain
        run: rustup toolchain install
      - name: Versions agree with the tag
        if: env.DRY_RUN != 'true'
        run: python3 -I scripts/check-versions.py "${GITHUB_REF_NAME#v}"
      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/timbre \
            target/aarch64-apple-darwin/release/timbre target/x86_64-apple-darwin/release/timbre
          lipo -info dist/timbre
      - name: Sign (Developer ID)
        if: env.DRY_RUN != 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No valid Developer ID Application identity in MACOS_CERTIFICATE."
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          codesign --force --timestamp --options runtime \
            --identifier io.github.alejandrosml.timbre \
            --entitlements packaging/Timbre.entitlements \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" dist/timbre
          codesign --verify --strict --verbose=2 dist/timbre
          codesign --display --verbose=2 dist/timbre 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp|flags"
      - name: Sign (ad-hoc, dry run)
        if: env.DRY_RUN == 'true'
        run: |
          codesign --force --options runtime --identifier io.github.alejandrosml.timbre \
            --entitlements packaging/Timbre.entitlements --sign - dist/timbre
          codesign --verify --strict --verbose=2 dist/timbre
      - name: Notarize
        if: env.DRY_RUN != 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent dist/timbre "$RUNNER_TEMP/timbre.zip"
          xcrun notarytool submit "$RUNNER_TEMP/timbre.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm "$RUNNER_TEMP/key.p8"
          python3 -c "import json,sys; s=json.load(open(sys.argv[1]))['status']; print('notarization:', s); sys.exit(s != 'Accepted')" "$RUNNER_TEMP/notary.json"
      - name: Package the Claude extension
        run: |
          npm install -g @anthropic-ai/mcpb@2.1.2
          scripts/package-mcpb.sh dist/timbre
          cd dist && shasum -a 256 timbre timbre-*.mcpb > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: env.DRY_RUN != 'true'
        with:
          subject-path: |
            dist/timbre
            dist/timbre-*.mcpb
      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/timbre-*.mcpb dist/timbre dist/SHA256SUMS
      - name: Keep the dry-run package
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timbre-dry-run
          path: dist/
          retention-days: 7
