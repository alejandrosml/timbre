name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: MCP end-to-end
        run: cargo build --locked && python3 -I tests/e2e_mcp.py target/debug/timbre
      - name: MCP end-to-end, from Timbre.app (signed ad hoc)
        if: runner.os == 'macOS'
        run: |
          scripts/make-app.sh target/debug/timbre build
          codesign --force --options runtime --entitlements packaging/Timbre.entitlements --sign - build/Timbre.app
          codesign --verify --strict --deep --verbose=2 build/Timbre.app
          python3 -I tests/e2e_mcp.py build/Timbre.app/Contents/MacOS/timbre
      - name: Versions agree
        run: python3 -I scripts/check-versions.py

  msrv:
    name: Minimum supported Rust (1.98)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98 --profile minimal
      - run: cargo +1.98 check --locked --all-targets

  deny:
    name: Licences and advisories (cargo-deny)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny
      - run: cargo deny --locked check
